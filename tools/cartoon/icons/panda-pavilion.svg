  <circle cx="67" cy="46.5" r="4.6" fill="#ffffff"/>
  <circle cx="93" cy="46.5" r="4.6" fill="#ffffff"/>
  <circle cx="67.6" cy="47.2" r="2.7" fill="#4a3a32"/>
  <circle cx="92.4" cy="47.2" r="2.7" fill="#4a3a32"/>
  <circle cx="66.6" cy="45.8" r="1.1" fill="#ffffff"/>
  <circle cx="91.4" cy="45.8" r="1.1" fill="#ffffff"/>
