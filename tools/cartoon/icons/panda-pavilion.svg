    <path d="M120 112 C128 100 126 86 116 76 C108 70 96 74 98 84 C100 92 104 100 104 114 Z"/>
  </g>
  <path d="M46 82 Q50 78 55 79" stroke="#a9b1b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M104 79 Q109 76 114 79" stroke="#a9b1b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
