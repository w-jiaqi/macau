    <ellipse cx="50" cy="134" rx="18" ry="13" fill="#4a3a32" transform="rotate(-15 50 134)"/>
    <ellipse cx="110" cy="134" rx="18" ry="13" fill="#4a3a32" transform="rotate(15 110 134)"/>
  </g>
  <g fill="#f4a7b9">
