    <circle cx="40" cy="129" r="2.6"/><circle cx="45" cy="125.5" r="2.6"/><circle cx="51" cy="124" r="2.6"/>
    <circle cx="120" cy="129" r="2.6"/><circle cx="115" cy="125.5" r="2.6"/><circle cx="109" cy="124" r="2.6"/>
