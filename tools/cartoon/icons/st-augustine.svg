    <rect x="35" y="82" width="17" height="5" fill="#ffffff"/>
    <rect x="35" y="126" width="17" height="5" fill="#ffffff"/>
    <rect x="57" y="82" width="11" height="48" fill="#ffffff"/>
    <rect x="54" y="82" width="17" height="5" fill="#ffffff"/>
    <rect x="54" y="126" width="17" height="5" fill="#ffffff"/>
    <rect x="84" y="82" width="11" height="48" fill="#ffffff"/>
    <rect x="81" y="82" width="17" height="5" fill="#ffffff"/>
    <rect x="81" y="126" width="17" height="5" fill="#ffffff"/>
    <rect x="103" y="82" width="11" height="48" fill="#ffffff"/>
    <rect x="100" y="82" width="17" height="5" fill="#ffffff"/>
