  <meta property="og:description" content="外港码头 → 精选景点 → 氹仔码头，一张图看懂澳门一日游路线。">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">

</head>
<body>

  <div id="app" class="is-loading">
    <div id="map" role="region" aria-label="澳门地图"></div>

    <div class="map-tools" role="toolbar" aria-label="地图工具">
      <button class="tool" id="btn-mode" type="button" aria-pressed="false" aria-label="切换到真实地图" title="切换到真实地图"><svg><use href="#i-layers"/></svg></button>
      <button class="tool" id="btn-fit" type="button" aria-label="查看全程" title="查看全程"><svg><use href="#i-fit"/></svg></button>
      <button class="tool" id="btn-locate" type="button" aria-label="我的位置" title="我的位置"><svg><use href="#i-locate"/></svg></button>
      <div class="tool-group only-fine">
        <button class="tool" id="btn-zoom-in" type="button" aria-label="放大"><svg><use href="#i-plus"/></svg></button>
        <button class="tool" id="btn-zoom-out" type="button" aria-label="缩小"><svg><use href="#i-minus"/></svg></button>
      </div>
    </div>

    <section class="sheet" id="sheet" aria-label="路线地点">
      <div class="sheet-grip" id="sheet-grip"><span class="grip-bar" aria-hidden="true"></span></div>

      <!-- Stop list -->
      <div class="sheet-view" id="view-list">
        <div class="sheet-head">
          <div class="summary">
            <h1 class="summary-main" id="title">澳门一日游</h1>
            <p class="summary-sub" id="credit">Made by Jiaqi Wang</p>
          </div>
          <button class="icon-btn only-wide" id="btn-collapse" type="button" aria-label="收起面板" title="收起面板"><svg><use href="#i-collapse"/></svg></button>
        </div>
        <div class="sheet-scroll" id="list-scroll">
          <ol class="stops" id="stops"></ol>
          <p class="hint">点任意一站修改地点，可选热门景点，也可以输入任何澳门地名、酒店或餐厅；用「添加一站」增加站点，点 × 删除。起点与终点固定。你的修改只保存在自己的浏览器里。</p>
          <footer class="sheet-foot">
            <p>插画地图与真实地图严格对齐；路线沿真实道路计算（步行或车行），仅供参考。</p>
            <p>地图数据 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 贡献者 · 路线 OSRM · 搜索 Nominatim · 地图库 <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a></p>
          </footer>
        </div>
      </div>

      <!-- Search for one stop -->
      <div class="sheet-view" id="view-search" hidden>
        <div class="sheet-head search-head">
          <button class="icon-btn" id="btn-back" type="button" aria-label="返回"><svg><use href="#i-back"/></svg></button>
          <p class="summary-main" id="search-title">第一站</p>
        </div>
        <form class="search-box" id="search-form" autocomplete="off" role="search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search-input" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入地点，如：大三巴牌坊" aria-label="地点名称">
          <button class="icon-btn" id="search-clear" type="button" aria-label="清空输入" hidden><svg><use href="#i-close"/></svg></button>
        </form>
        <div class="sheet-scroll" id="search-scroll">
          <div id="search-results" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <button class="panel-open" id="btn-expand" type="button" aria-label="展开路线面板" hidden>
      <svg aria-hidden="true"><use href="#i-expand"/></svg><span id="panel-open-label">路线</span>
    </button>

    <div class="loading" id="loading" aria-live="polite">
      <svg class="loading-tile" aria-hidden="true"><use href="#tile"/></svg>
      <p>正在打开澳门地图…</p>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript><p class="noscript">本页面需要启用 JavaScript 才能显示地图。</p></noscript>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
